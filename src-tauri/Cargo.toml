[package]
name = "fm27-manager"
version = "0.13.1"
description = "Gestion d'équipe pour Football Manager 27"
authors = ["Nathan"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "2"
base64 = "0.22"
png = "0.17"
# Lecture des sauvegardes FM27 (frames zstd)
zstd = "0.13"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"

# Capture de la fenêtre de FM27 et OCR Windows (lecture de l'écran, jamais du jeu lui-même)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging",
] }
